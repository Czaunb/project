name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
      - claude/webxr-quest-https-setup-8e0p9e
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      # enablement: true bekapcsolja a Pages-t, ha még nincs bekapcsolva,
      # így nem kell kézzel beállítani a repo Settings alatt.
      - uses: actions/configure-pages@v5
        with:
          enablement: true

      # Csak a két HTML kerül ki, a szkriptek és a .git nem.
      - name: Assemble site
        run: |
          mkdir -p _site
          cp index.html check.html _site/

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v4
